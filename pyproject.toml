[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-forge-portfolio"
version = "0.1.0"
description = "A deterministic portfolio prototype for constrained agentic software workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coral-forge-demo = "coral_forge_portfolio.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
